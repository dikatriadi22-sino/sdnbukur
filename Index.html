<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Aplikasi</title>
    <!-- Favicon (opsional, bisa diganti) -->
    <link rel="icon" href="https://github.githubassets.com/favicons/favicon.svg">
    <style>
        /* Menghilangkan margin dan membuat halaman 100% layar */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Mencegah munculnya scrollbar ganda */
            background-color: #f3f4f6; /* Warna latar belakang saat loading */
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* Tampilan loading di latar belakang sebelum iframe selesai dimuat */
        .loading-container {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1;
            color: #4b5563;
        }

        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: #2563eb;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Pengaturan Iframe agar menutupi seluruh layar */
        iframe {
            position: relative;
            z-index: 2; /* Iframe berada di atas animasi loading */
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }
    </style>
</head>
<body>

    <!-- Animasi Loading -->
    <div class="loading-container">
        <div class="spinner"></div>
        <p>Memuat aplikasi...</p>
    </div>

    <!-- Iframe untuk menampilkan Web App Google Apps Script -->
    <iframe 
        src="https://script.google.com/macros/s/AKfycbx_aSoZKrHCUCfWAAx3MQmHDb7HyC5kHTxaz_0oJemOYKQQ6v2a4eRvrSD8Jvy4iVmk/exec" 
        allowfullscreen>
    </iframe>

</body>
</html>
